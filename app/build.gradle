plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wifispeaker'
    compileSdk 34

    defaultConfig {
        applicationId "com.wifispeaker"
        // Android 5.1.1 = API 22. O receptor roda a partir do API 21.
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }
}
